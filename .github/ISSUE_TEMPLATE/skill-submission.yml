name: Submit a BIM/CAD skill for review
description: Propose an AutoCAD, Revit, or other BIM/CAD skill without adding it to the approved library.
title: "Skill submission: "
labels:
  - skill-submission
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing. Run **Review local skills** in BIM-CAD MCP Setup, inspect the generated package, then attach the ZIP to this issue. Do not submit drawings, models, credentials, chat transcripts, or client information.
  - type: input
    id: skill-name
    attributes:
      label: Skill name
      placeholder: revit-room-data-check
    validations:
      required: true
  - type: dropdown
    id: application
    attributes:
      label: Application
      options:
        - Revit 2024
        - AutoCAD
        - Other BIM/CAD application
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: What does the skill do?
      description: Describe the repeatable workflow and when it should be used.
    validations:
      required: true
  - type: dropdown
    id: verification
    attributes:
      label: Highest verification completed
      options:
        - Instructions only / not tested
        - Mock test
        - File or build test
        - Live read test
        - Live write test with readback
    validations:
      required: true
  - type: textarea
    id: package
    attributes:
      label: Review package
      description: Drag the generated skill-review ZIP here after inspecting it.
      placeholder: Attach the ZIP generated by BIM-CAD MCP Setup.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Contributor confirmation
      options:
        - label: I created or have permission to share these skill files.
          required: true
        - label: I reviewed the package and removed credentials, drawings/models, chat transcripts, and client information.
          required: true
        - label: I understand submission does not guarantee acceptance into the approved repository skills.
          required: true
