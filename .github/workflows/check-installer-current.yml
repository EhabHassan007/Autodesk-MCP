name: Check stored installer is current

on:
  workflow_dispatch:
  # Pull requests only: the merge to main is the same code, so testing it again would only double the minutes.
  # Run it by hand on any branch with workflow_dispatch.
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the older run, so superseded commits use no minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer-current:
    runs-on: windows-latest
    timeout-minutes: 10   # a hung job stops here instead of using minutes until the 6-hour limit
    steps:
      - uses: actions/checkout@v4

      # Fails when source/runtime changed without rebuilding the stored ZIPs, or a join code is committed.
      - name: Stored installer matches source and holds no join code
        shell: powershell
        run: ./release-preparation/beta17/tests/check-installer-current.ps1
