name: Check stored installer is current

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Draft pull requests use no minutes: the jobs run when the PR is opened ready or marked Ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
  # Main is checked after every merge: a pull request is tested against the main it started from, and two pull requests
  # that pass on their own can still break main together.
  push:
    branches: [main]

# A newer push to the same pull request cancels the older run, so superseded commits use no minutes. Runs on main are
# never cancelled, so every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  installer-current:
    # GitHub's Windows machine for pull requests and pushes. WINDOWS_RUNNER (Settings > Secrets and variables > Actions >
    # Variables), the label of a self-hosted runner, is used only for a run the owner starts by hand (workflow_dispatch),
    # because this repository is public: a pull request from anyone would otherwise run its own code on that PC. Run the
    # self-hosted runner under its own Windows account, because these jobs install Smart Connector and edit AI client settings.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && vars.WINDOWS_RUNNER || 'windows-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 10   # a hung job stops here instead of using minutes until the 6-hour limit
    steps:
      - uses: actions/checkout@v4

      # Fails when source/runtime changed without rebuilding the stored ZIPs, or a join code is committed.
      - name: Stored installer matches source and holds no join code
        shell: powershell
        run: ./release-preparation/beta17/tests/check-installer-current.ps1
