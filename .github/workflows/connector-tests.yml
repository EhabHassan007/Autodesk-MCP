name: Connector tests (Windows)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Draft pull requests use no minutes: the jobs run when the PR is opened ready or marked Ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
  # Main is checked after every merge: a pull request is tested against the main it started from, and two pull requests
  # that pass on their own can still break main together.
  push:
    branches: [main]

# A newer push to the same pull request cancels the older run, so superseded commits use no minutes. Runs on main are
# never cancelled, so every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    # GitHub's Windows machine for pull requests and pushes. WINDOWS_RUNNER (Settings > Secrets and variables > Actions >
    # Variables), the label of a self-hosted runner, is used only for a run the owner starts by hand (workflow_dispatch),
    # because this repository is public: a pull request from anyone would otherwise run its own code on that PC. Run the
    # self-hosted runner under its own Windows account, because these jobs install Smart Connector and edit AI client settings.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && vars.WINDOWS_RUNNER || 'windows-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Each test runs in its own Windows PowerShell 5.1 process, because the tests change environment
      # variables such as LOCALAPPDATA. One failure does not stop the others; the job fails at the end.
      - name: Run release-preparation/beta17/tests
        shell: powershell
        run: |
          # GitHub runs this step with ErrorActionPreference Stop; a test writing to stderr must not end the run.
          $ErrorActionPreference = 'Continue'
          # test-beta15-upgrade needs a built package and runs in its own step below.
          $tests = Get-ChildItem release-preparation\beta17\tests -Filter 'test-*.ps1' | Where-Object Name -ne 'test-beta15-upgrade.ps1' | Sort-Object Name
          $tests += Get-Item release-preparation\beta17\tests\check-beta15.ps1
          $failed = @()
          foreach ($test in $tests) {
            Write-Host "::group::$($test.Name)"
            $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test.FullName 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host ([string]$_) }
            Write-Host '::endgroup::'
            if ($code -ne 0) { $failed += $test.Name; Write-Host "::error title=$($test.Name)::exit $code" }
            else { Write-Host "OK  $($test.Name)" }
          }
          "Ran $($tests.Count) tests; $($failed.Count) failed." | Write-Host
          if ($failed.Count) { throw ('Failed: ' + ($failed -join ', ')) }

      # The Revit add-in is compiled on each PC by the .NET Framework compiler that ships with Windows. Compile it
      # here with that same compiler, against the Revit 2024 API reference assemblies from NuGet (references
      # only, used for this check and never shipped), so a compile error is caught before release.
      - name: Compile the Revit 2024 add-in
        shell: powershell
        run: |
          $refs = Join-Path $env:RUNNER_TEMP 'revit-2024-api'
          New-Item -ItemType Directory -Path $refs -Force | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($name in 'revitapi', 'revitapiui') {
            $package = Join-Path $env:RUNNER_TEMP "$name.nupkg"
            Invoke-WebRequest -UseBasicParsing -OutFile $package -Uri "https://api.nuget.org/v3-flatcontainer/nice3point.revit.api.$name/2024.3.60/nice3point.revit.api.$name.2024.3.60.nupkg"
            $zip = [IO.Compression.ZipFile]::OpenRead($package)
            try { foreach ($entry in $zip.Entries | Where-Object FullName -like 'ref/net48/*.dll') { [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $refs $entry.Name), $true) } }
            finally { $zip.Dispose() }
          }
          & release-preparation\beta17\source\runtime\src\revit\build-revit-addin.ps1 -RevitInstallPath $refs -OutputPath (Join-Path $env:RUNNER_TEMP 'revit-addin')
          # Every ribbon image must be the size of its slot (32 x 32 large, 16 x 16 small): Revit cuts off the rest.
          Add-Type -AssemblyName PresentationCore, WindowsBase
          $addin = [Reflection.Assembly]::LoadFrom((Join-Path $env:RUNNER_TEMP 'revit-addin\BimCadMcp.Revit.dll'))
          $icons = $addin.GetType('BimCadMcp.Revit.Icons', $true)
          $flags = [Reflection.BindingFlags]'Static, NonPublic'
          $images = @()
          # The images the ribbon shows: Icons.Line for each button (Connect, Status, Skills Sync and the More menu) and Icons.More.
          foreach ($name in 'status', 'diagnostics', 'sync', 'skills', 'updates', 'settings', 'info', 'help') {
            foreach ($small in $true, $false) { $images += ,@("$name", $small, $icons.GetMethod('Line', $flags).Invoke($null, @($name, $small, ($name -eq 'status')))) }
          }
          foreach ($small in $true, $false) { $images += ,@('more', $small, $icons.GetMethod('More', $flags).Invoke($null, @($small))) }
          foreach ($entry in $images) {
            $want = if ($entry[1]) { 16 } else { 32 }
            if ([Math]::Abs($entry[2].Width - $want) -gt 0.01 -or [Math]::Abs($entry[2].Height - $want) -gt 0.01) { throw "Ribbon icon $($entry[0]) ($(if ($entry[1]) { 'small' } else { 'large' })) is $($entry[2].Width) x $($entry[2].Height); expected $want x $want." }
          }
          "Ribbon icons: $($images.Count) images, each 32 x 32 (large) or 16 x 16 (small)."

      # The upgrade test installs a real release package over an older install.
      - name: Upgrade from an older release
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File release-preparation\beta17\build.ps1 | Out-Host
          $package = Get-ChildItem release-preparation\beta17 -Filter 'Autodesk-MCP-Connector-*.zip' | Where-Object Name -notlike '*-TEAM.zip' | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File release-preparation\beta17\tests\test-beta15-upgrade.ps1 -PackagePath $package.FullName -TestBasePath $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "test-beta15-upgrade failed (exit $LASTEXITCODE)" }
