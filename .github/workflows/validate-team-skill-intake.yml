name: Validate team skill intake

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed skill candidates
        shell: pwsh
        run: ./scripts/validate-team-skill-intake.ps1 -BaseRef "origin/${{ github.base_ref }}" -HeadRef "${{ github.head_ref }}"
