name: Validate team skill intake

on:
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the older run, so superseded commits use no minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # GitHub's Windows machine by default. Set the repository variable WINDOWS_RUNNER (Settings > Secrets and variables >
    # Actions > Variables) to the label of a self-hosted runner, such as smart-connector, to run on your own PC for free.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 10   # a hung job stops here instead of using minutes until the 6-hour limit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed skill candidates
        shell: pwsh
        run: ./scripts/validate-team-skill-intake.ps1 -BaseRef "origin/${{ github.base_ref }}" -HeadRef "${{ github.head_ref }}"
