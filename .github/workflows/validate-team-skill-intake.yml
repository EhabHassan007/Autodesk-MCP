name: Validate team skill intake

on:
  pull_request:
    branches: [main]
    # Runs on draft pull requests too: Smart Connector opens team intake pull requests as drafts, and the owner reviews
    # them with this check's result.
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same pull request cancels the older run, so superseded commits use no minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Always GitHub's own Windows machine: intake pull requests carry untrusted contributor content, so this job never
    # runs on a self-hosted runner.
    runs-on: windows-latest
    timeout-minutes: 10   # a hung job stops here instead of using minutes until the 6-hour limit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate changed skill candidates
        shell: pwsh
        # Branch names come from the pull request, so they reach the script as environment values, never as script text.
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: ./scripts/validate-team-skill-intake.ps1 -BaseRef "origin/$env:BASE_REF" -HeadRef "$env:HEAD_REF"
