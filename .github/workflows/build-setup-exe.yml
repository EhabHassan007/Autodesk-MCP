name: Build setup exe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Draft pull requests use no minutes: the jobs run when the PR is opened ready or marked Ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A newer push to the same pull request cancels the older run, so superseded commits use no minutes. Runs on main are
# never cancelled, so every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The LibreDWG pack (the programs behind dwg_inspect and dwg_convert) is never committed. It is cross-compiled here on
  # Linux (half the minutes of Windows), only once per pinned version thanks to the cache, and checked file by file
  # against libredwg-pack.json; build.ps1 checks it again before it goes into the installer.
  # The binaries depend on WHERE Zig is installed (the same source, Zig, CMake and Ninja gave other bytes with Zig in a
  # virtualenv), not on the CMake or Ninja version or Zig's cache folder. The pinned hashes come from Zig 0.17.1 installed
  # by pip into /usr/local/lib/python3.13/site-packages, which is exactly where pip puts it in the python:3.13 image, so
  # the job runs in that container (the plain runner put Zig elsewhere and every binary differed).
  libredwg-pack:
    runs-on: ubuntu-latest
    container: python:3.13-bookworm
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: libredwg-pack
          key: libredwg-pack-${{ hashFiles('release-preparation/beta17/libredwg-pack.json', 'scripts/build-libredwg-windows.sh') }}

      - name: Build the LibreDWG pack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet --root-user-action=ignore ziglang==0.17.1 cmake==3.28.3 ninja==1.11.1.1
          python3 -c "import ziglang, os; print('Zig is in', os.path.dirname(ziglang.__file__))"
          cmake --version | head -n 1
          bash scripts/build-libredwg-windows.sh libredwg-pack

      - name: Check the pack against libredwg-pack.json
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.load(open('release-preparation/beta17/libredwg-pack.json'))
          folder = pathlib.Path('libredwg-pack')
          bad = [n for n, h in manifest['files'].items()
                 if not (folder / n).is_file() or hashlib.sha256((folder / n).read_bytes()).hexdigest() != h.lower()]
          if bad: sys.exit('The LibreDWG pack does not match libredwg-pack.json: ' + ', '.join(bad))
          print('LibreDWG pack matches libredwg-pack.json:', len(manifest['files']), 'files')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: libredwg-pack
          path: libredwg-pack/
          retention-days: 1

  setup-exe:
    needs: libredwg-pack
    # GitHub's Windows machine for pull requests and pushes. WINDOWS_RUNNER (Settings > Secrets and variables > Actions >
    # Variables), the label of a self-hosted runner, is used only for a run the owner starts by hand (workflow_dispatch),
    # because this repository is public: a pull request from anyone would otherwise run its own code on that PC. Run the
    # self-hosted runner under its own Windows account, because these jobs install Smart Connector and edit AI client settings.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && vars.WINDOWS_RUNNER || 'windows-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 20   # a hung job stops here instead of using minutes until the 6-hour limit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libredwg-pack
          path: libredwg-pack

      - name: Install Inno Setup if the runner lacks it
        shell: powershell
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ }
          if (-not $iscc -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }

      # Public build only: no -Team, so no join code is involved. The LibreDWG pack goes into the release ZIP and the setup exe.
      - name: Build installer ZIP and setup exe
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File release-preparation\beta17\build.ps1 -LibreDwgPack libredwg-pack

      - name: Check the setup exe
        shell: powershell
        run: |
          $exe = @(Get-ChildItem release-preparation\beta17 -Filter 'Smart-Connector-Setup-*.exe')
          if ($exe.Count -ne 1 -or $exe[0].Name -like '*-TEAM.exe') { throw "Expected one public setup exe, found: $($exe.Name -join ', ')" }
          if ($exe[0].Length -lt 100KB) { throw 'The setup exe is unexpectedly small.' }
          "$($exe[0].Name): $([int]($exe[0].Length / 1KB)) KB"

      # Install the setup exe the way a person would (silently), look at what it put on the PC, and run the installed
      # program: its windows, the version and the install engine. The setup exe must install no script of its own.
      - name: Install the setup exe and check what it installed
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem release-preparation\beta17 -Filter 'Smart-Connector-Setup-*.exe' | Select-Object -First 1
          $install = Start-Process -FilePath $exe.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The setup exe exited with $($install.ExitCode)." }
          $root = Join-Path $env:LOCALAPPDATA 'BIM-CAD-MCP'
          $program = Join-Path $root 'bin\SmartConnector.exe'
          if (-not (Test-Path -LiteralPath $program -PathType Leaf)) { throw 'bin\SmartConnector.exe was not installed.' }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'setup\setup-pending.txt'))) { throw 'The first-open marker was not written.' }
          if (-not (Test-Path -LiteralPath (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Smart Connector.lnk'))) { throw 'The Start menu entry was not created.' }
          # The offline DWG tools: every file of the LibreDWG pack is installed in bin\libredwg.
          $pack = (Get-Content -LiteralPath release-preparation\beta17\libredwg-pack.json -Raw | ConvertFrom-Json).files.PSObject.Properties.Name
          $missing = @($pack | Where-Object { -not (Test-Path -LiteralPath (Join-Path $root "bin\libredwg\$_") -PathType Leaf) })
          if ($missing.Count) { throw ('The LibreDWG pack was not installed: ' + ($missing -join ', ')) }
          "LibreDWG pack installed: $($pack.Count) files in bin\libredwg."
          $types = '.ps1', '.psm1', '.psd1', '.cmd', '.bat', '.vbs', '.js', '.wsf'
          $library = (Join-Path $root '.agents') + '\'
          function Get-Scripts { @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | Where-Object { $types -contains $_.Extension.ToLowerInvariant() }) }
          $stray = @(Get-Scripts | Where-Object { -not $_.FullName.StartsWith($library, [StringComparison]::OrdinalIgnoreCase) })
          if ($stray.Count) { throw ('The setup exe installed scripts: ' + (($stray | ForEach-Object { $_.FullName.Substring($root.Length + 1) }) -join ', ')) }
          $inLibrary = @(Get-Scripts | Where-Object { $_.FullName.StartsWith($library, [StringComparison]::OrdinalIgnoreCase) })
          "Installed $(@(Get-ChildItem -LiteralPath $root -Recurse -File -Force).Count) files. Scripts outside the skill library: 0. Scripts inside the skill library (skill helper files): $($inLibrary.Count)."
          function Invoke-Program([string]$Arguments) {
            $out = Join-Path $env:RUNNER_TEMP ('program-' + [guid]::NewGuid().ToString('N') + '.txt')
            $process = Start-Process -FilePath $program -ArgumentList $Arguments -Wait -PassThru -RedirectStandardOutput $out -WorkingDirectory $env:LOCALAPPDATA
            [pscustomobject]@{ Code = $process.ExitCode; Text = [string](Get-Content -LiteralPath $out -Raw) }
          }
          $version = (Get-Content -LiteralPath (Join-Path $root 'VERSION') -Raw).Trim()
          $run = Invoke-Program '--version'
          if ($run.Code -ne 0 -or $run.Text.Trim() -ne $version) { throw "--version printed '$($run.Text)' (exit $($run.Code)); expected $version." }
          foreach ($arguments in 'app --smoke-test', 'setup --smoke-test') {
            $run = Invoke-Program $arguments
            if ($run.Code -ne 0) { throw "'$arguments' exited with $($run.Code). $($run.Text)" }
          }
          $run = Invoke-Program 'engine --action Status --product Revit'
          if ($run.Code -ne 0 -or $run.Text -notmatch 'Smart Connector - Status') { throw "engine Status failed (exit $($run.Code)): $($run.Text)" }
          # The install engine, from the installed files only: the same step the first open runs.
          $run = Invoke-Program ('engine --action Install --repository-path "{0}" --skills Off --ai-clients Codex --product Revit' -f $root)
          if ($run.Code -ne 0) { throw "engine Install failed (exit $($run.Code)): $($run.Text)" }
          if (Test-Path -LiteralPath (Join-Path $root 'setup\setup-pending.txt')) { throw 'Install did not clear the first-open marker.' }
          $stray = @(Get-Scripts | Where-Object { -not $_.FullName.StartsWith($library, [StringComparison]::OrdinalIgnoreCase) })
          if ($stray.Count) { throw ('Install left scripts behind: ' + (($stray | ForEach-Object { $_.FullName.Substring($root.Length + 1) }) -join ', ')) }
          # Install again while Smart Connector runs, as the MCP server Claude starts does: setup must move the program
          # aside (no closing programs, no error), and the next start of Smart Connector deletes the old copy.
          $bin = Split-Path -Parent $program
          $serverInfo = New-Object Diagnostics.ProcessStartInfo($program, 'mcp')
          $serverInfo.UseShellExecute = $false; $serverInfo.RedirectStandardInput = $true; $serverInfo.RedirectStandardOutput = $true
          $server = [Diagnostics.Process]::Start($serverInfo)
          try {
            $again = Start-Process -FilePath $exe.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($again.ExitCode -ne 0) { throw "Installing over a running Smart Connector exited with $($again.ExitCode)." }
            if (-not (Test-Path -LiteralPath $program -PathType Leaf)) { throw 'The program is missing after installing over a running copy.' }
            if (-not @(Get-ChildItem -LiteralPath $bin -Filter 'SmartConnector.exe.old*').Count) { throw 'The running program was not moved aside.' }
          }
          finally { try { $server.StandardInput.Close(); if (-not $server.WaitForExit(5000)) { $server.Kill() } } catch { } }
          $run = Invoke-Program '--version'
          if ($run.Code -ne 0) { throw "The newly installed program did not start (exit $($run.Code))." }
          $left = @(Get-ChildItem -LiteralPath $bin -Filter 'SmartConnector.exe.old*')
          if ($left.Count) { throw ('The old copy was not deleted at the next start: ' + (($left | ForEach-Object Name) -join ', ')) }
          'The installed program ran its windows, reported its version and completed the install engine without any script.'

      - uses: actions/upload-artifact@v4
        with:
          name: smart-autodesk-connector-setup
          path: release-preparation/beta17/Smart-Connector-Setup-*.exe
          retention-days: 30

      # Every file of a public release, from this one build, so the update files and their SHA-256 values match the
      # ZIPs: download this artifact and attach its files to the release in Autodesk-MCP-Releases. Nothing is published here.
      - uses: actions/upload-artifact@v4
        with:
          name: smart-connector-release
          path: |
            release-preparation/beta17/Autodesk-MCP-Connector-*.zip
            release-preparation/beta17/Smart-Connector-*.zip
            release-preparation/beta17/latest.json
            release-preparation/beta17/smart-connector.json
            release-preparation/beta17/RELEASE-NOTES.md
            release-preparation/beta17/Smart-Connector-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
